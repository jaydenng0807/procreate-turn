<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Procreate Turn Lock</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --free: #22c55e;
      --busy: #ef4444;
      --you: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }
    .wrap {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid #2a2f3a;
      border-radius: 20px;
      padding: 28px 24px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: .01em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.45;
    }
    button#lockBtn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 18px 16px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease, background .15s ease;
      color: white;
      background: var(--free);
    }
    button#lockBtn:active:not(:disabled) { transform: scale(.98); }
    button#lockBtn.busy { background: var(--busy); cursor: not-allowed; }
    button#lockBtn.yours { background: var(--you); cursor: pointer; }
    button#lockBtn:disabled { opacity: .95; }
    .status {
      margin-top: 16px;
      font-size: .9rem;
      color: var(--muted);
      min-height: 1.3em;
    }
    .meta {
      margin-top: 14px;
      font-size: .8rem;
      color: #71717a;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #71717a;
      vertical-align: middle;
    }
    .dot.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Procreate turn lock</h1>
    <p>Click <strong>Animation</strong> to take the turn. Others see “animation in use” until you release it.</p>
    <button id="lockBtn" type="button">Animation</button>
    <div class="status" id="status">Connecting…</div>
    <div class="meta"><span class="dot" id="syncDot"></span><span id="syncText">Syncing</span> · you are <span id="whoami">…</span></div>
  </main>

  <script type="module">
    // Server-mediated sync (MQTT over WebSocket on public brokers).
    // WebRTC was dropped: school/NAT networks never joined the same peer mesh,
    // so each browser kept a private lock. These brokers relay one retained
    // JSON snapshot. v2 topic so old y-webrtc rooms cannot collide.
    import mqtt from 'https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.esm.js'

    const TOPIC = 'jaydenng0807/procreate-turn/verity-procreate-animation-turn-v2'
    const STALE_MS = 45000
    const HEARTBEAT_MS = 8000
    const BROKERS = [
      { url: 'wss://demo.tbmq.io/mqtt', username: 'demo' },
      { url: 'wss://iot.coreflux.cloud/mqtt' },
      { url: 'wss://broker.emqx.io:8084/mqtt' }
    ]

    const connect = mqtt.connect || (mqtt.default && mqtt.default.connect)
    if (!connect) throw new Error('MQTT client failed to load')

    const btn = document.getElementById('lockBtn')
    const statusEl = document.getElementById('status')
    const whoamiEl = document.getElementById('whoami')
    const syncDot = document.getElementById('syncDot')
    const syncText = document.getElementById('syncText')

    const adjectives = ['Swift','Quiet','Bold','Lucky','Pixel','Nova','Ink','Coral','Mint','Amber']
    const nouns = ['Fox','Owl','Bear','Koala','Finch','Moth','Lynx','Puffin','Otter','Crane']
    function randomName() {
      return adjectives[Math.floor(Math.random()*adjectives.length)] + ' ' + nouns[Math.floor(Math.random()*nouns.length)]
    }

    const myId = crypto.randomUUID()
    const myName = localStorage.getItem('turnName') || randomName()
    localStorage.setItem('turnName', myName)
    whoamiEl.textContent = myName

    function emptyLock() {
      return { held: false, holderId: '', holderName: '', heartbeat: 0, takeId: '', claimedAt: 0, rev: 0 }
    }

    let state = emptyLock()
    let canonical = ''
    let forwardTimer = 0
    const clients = []

    function now() { return Date.now() }

    function isStale(lock) {
      if (!lock || !lock.held) return false
      if (!lock.heartbeat) return true
      return now() - lock.heartbeat > STALE_MS
    }

    function compareClaim(a, b) {
      const ac = Number(a.claimedAt) || 0
      const bc = Number(b.claimedAt) || 0
      if (ac !== bc) return ac - bc
      const at = String(a.takeId || '')
      const bt = String(b.takeId || '')
      if (at === bt) return 0
      return at > bt ? 1 : -1
    }

    function freeFrom(next) {
      return {
        held: false,
        holderId: '',
        holderName: '',
        heartbeat: 0,
        takeId: next.takeId || '',
        claimedAt: Number(next.claimedAt) || 0,
        rev: Number(next.rev) || now()
      }
    }

    function apply(next) {
      if (!next || typeof next.held !== 'boolean') return
      if (typeof next.rev !== 'number') next.rev = Number(next.heartbeat) || Number(next.claimedAt) || 0

      if (!next.held) {
        if (state.held && next.takeId && next.takeId === state.takeId) {
          state = freeFrom(next)
        } else if (!state.held && next.rev > (state.rev || 0)) {
          state = freeFrom(next)
        }
        return
      }

      if (!state.held) {
        if (next.rev <= (state.rev || 0)) return
        state = next
        return
      }

      if (next.takeId && next.takeId === state.takeId) {
        if ((Number(next.heartbeat) || 0) >= (Number(state.heartbeat) || 0)) state = next
        return
      }

      if (isStale(state) && !isStale(next)) {
        state = next
        return
      }

      if (compareClaim(next, state) > 0) state = next
    }

    function connectedCount() {
      return clients.reduce((n, c) => n + (c.connected ? 1 : 0), 0)
    }

    function render() {
      const lock = state
      const mine = lock.held && lock.holderId === myId && !isStale(lock)
      const busyOther = lock.held && lock.holderId !== myId && !isStale(lock)
      const online = connectedCount() > 0

      btn.classList.remove('busy', 'yours')
      syncDot.classList.toggle('on', online)
      syncText.textContent = online ? 'Live' : 'Connecting'

      if (!online && !mine) {
        btn.textContent = 'Animation'
        btn.disabled = true
        statusEl.textContent = 'Connecting to the shared turn…'
        return
      }

      if (mine) {
        btn.textContent = 'Release Animation'
        btn.classList.add('yours')
        btn.disabled = false
        statusEl.textContent = 'You are animating — click again to free the turn.'
      } else if (busyOther) {
        btn.textContent = 'animation in use'
        btn.classList.add('busy')
        btn.disabled = true
        statusEl.textContent = `${lock.holderName || 'Someone'} is animating.`
      } else {
        btn.textContent = 'Animation'
        btn.disabled = !online
        statusEl.textContent = isStale(lock)
          ? 'Previous turn timed out — free to take.'
          : 'Free — click to take the animation turn.'
      }
    }

    function forward(payload) {
      for (const c of clients) {
        if (c.connected) c.publish(TOPIC, payload, { qos: 1, retain: true })
      }
    }

    function scheduleForward() {
      clearTimeout(forwardTimer)
      forwardTimer = setTimeout(() => {
        if (canonical) forward(canonical)
      }, 400)
    }

    function commit(next) {
      clearTimeout(forwardTimer)
      state = next
      canonical = JSON.stringify(state)
      forward(canonical)
      render()
    }

    function onMessage(raw) {
      if (!raw || raw === canonical) return
      let next
      try { next = JSON.parse(raw) } catch { return }
      const before = JSON.stringify(state)
      apply(next)
      const after = JSON.stringify(state)
      if (after !== before) {
        canonical = after
        render()
        scheduleForward()
      } else if (canonical) {
        scheduleForward()
      }
    }

    function take() {
      if (connectedCount() === 0) return
      if (state.held && state.holderId !== myId && !isStale(state)) return
      const t = now()
      commit({
        held: true,
        holderId: myId,
        holderName: myName,
        heartbeat: t,
        takeId: crypto.randomUUID(),
        claimedAt: t,
        rev: t
      })
    }

    function release() {
      if (state.holderId !== myId) return
      const t = now()
      commit({
        held: false,
        holderId: '',
        holderName: '',
        heartbeat: 0,
        takeId: state.takeId,
        claimedAt: state.claimedAt,
        rev: t
      })
    }

    btn.addEventListener('click', () => {
      if (state.held && state.holderId === myId && !isStale(state)) release()
      else take()
    })

    const suffix = Math.random().toString(36).slice(2, 10)
    BROKERS.forEach((broker, i) => {
      const opts = {
        clientId: 'pt' + suffix + i,
        clean: true,
        reconnectPeriod: 3000,
        connectTimeout: 8000,
        keepalive: 30,
        protocolVersion: 4
      }
      if (broker.username) opts.username = broker.username
      const client = connect(broker.url, opts)
      clients.push(client)
      client.on('connect', () => {
        client.subscribe(TOPIC, { qos: 1 }, () => {
          // Let retained snapshots arrive, then re-publish the newest one
          // so a broker that missed a release/take catches up.
          if (canonical) scheduleForward()
          render()
        })
      })
      client.on('message', (_topic, payload) => {
        const raw = typeof payload === 'string' ? payload : new TextDecoder().decode(payload)
        onMessage(raw)
      })
      client.on('reconnect', render)
      client.on('close', render)
      client.on('offline', render)
      client.on('error', () => {})
    })

    setInterval(() => {
      if (state.held && state.holderId === myId) {
        const t = now()
        commit({ ...state, heartbeat: t, rev: t })
      }
      render()
    }, HEARTBEAT_MS)

    window.addEventListener('pagehide', () => {
      if (state.held && state.holderId === myId) release()
    })

    render()
  </script>
</body>
</html>
